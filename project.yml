name: UnifiedMedia
options:
  bundleIdPrefix: app.unifiedmedia
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    revision: e20d5cfc847c2cfa02aaf7be409848b504bd46ca
targets:
  UnifiedMedia:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/**
    resources:
      - Sources/Resources/Fonts/Fast_Serif.ttf
      - Sources/Resources/ThirdPartyLicenses/Fast-Font-MIT.txt
      - Sources/Resources/ThirdPartyLicenses/Readium-BSD-3-Clause.txt
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.unifiedmedia.ios
        INFOPLIST_FILE: Config-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  UnifiedMediaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: UnifiedMedia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.unifiedmedia.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/UnifiedMedia.app/UnifiedMedia
schemes:
  UnifiedMedia:
    build:
      targets:
        UnifiedMedia: all
        UnifiedMediaTests: [test]
    test:
      targets:
        - UnifiedMediaTests
